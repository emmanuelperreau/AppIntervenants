# Pages surveillees par le hook visual-gate au push (app statique, uv run python -m http.server 8000).
# Pas de connexion : la PWA est 100% publique (aucune authentification dans le code), donc
# pas d'"accueil connecte" ni de page de login a couvrir.
# index.html injecte au chargement (fetch) les 5 onglets accueil/quotidien/remuneration/
# docs/contacts dans un seul DOM : les selecteurs couvrent le header et la nav statiques,
# puis un element propre a chaque onglet injecte (money-banner = tab-money, concatene sur
# 3 fichiers ; daily-top-grid, services-section, urgence-bar = les 3 autres partiels).
# Une regression d'injection ou une exception JS dans app.js casse au moins un de ces 7.
http://localhost:8000/index.html    .site-header,.nav-bar,.tool-grid,.money-banner,.daily-top-grid,.services-section,.urgence-bar
#
# simulateur.html (ecran metier central) : sa div principale porte une animation d'entree
# (classe "slide-in", styles/base.css, translateX(100%) -> 0 sur 0,3 s). Une capture pleine
# page tombe pendant la transition et n'est pas reproductible (0 passe sur 6 essais) :
# presence seule, sans comparaison de capture.
http://localhost:8000/simulateur.html    .sim-header,.sim-main,.sim-info-banner    --presence-seule
