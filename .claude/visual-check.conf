# Pages surveillees par le hook visual-gate au push (app statique, python3 -m http.server 8000).
# Pas de connexion : la PWA est 100% publique (aucune authentification dans le code), donc
# pas d'"accueil connecte" ni de page de login a couvrir.
# index.html injecte au chargement (fetch) les 5 onglets accueil/quotidien/remuneration/
# docs/contacts dans un seul DOM : les selecteurs couvrent le header et la nav statiques,
# puis un element propre a chaque onglet injecte (money-banner = tab-money, concatene sur
# 3 fichiers ; daily-top-grid, services-section, urgence-bar = les 3 autres partiels).
# Une regression d'injection ou une exception JS dans app.js casse au moins un de ces 7.
http://localhost:8000/index.html    .site-header,.nav-bar,.tool-grid,.money-banner,.daily-top-grid,.services-section,.urgence-bar
#
# simulateur.html (ecran metier central, hors accueil) volontairement absent : sa div
# principale porte la classe "slide-in" (styles/base.css, @keyframes slideIn 0.3s,
# translateX(100%) -> translateX(0)) appliquee des le chargement. Le screenshot plein-page
# du script peut tomber pendant l'animation, ce qui fait varier la largeur de scroll de la
# page (mesure : 678 a 744px sur un viewport mobile de 390px selon l'instant exact de la
# capture) et fait donc echouer la comparaison de baseline de facon non reproductible :
# 0 pass sur 6 essais consecutifs baseline/verification. Racine dans le CSS de l'app
# (hors perimetre de cette tache, aucun code applicatif modifie) : a corriger cote app
# (retirer l'animation d'entree ou la neutraliser en test) avant de pouvoir l'ajouter ici.
