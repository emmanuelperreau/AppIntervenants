<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Agence O2</title>
    <meta id="apple-web-app-title" name="apple-mobile-web-app-title" content="Agence O2">
    <link rel="manifest" id="dynamic-manifest" />
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var agence = params.get('agence');

            // On récupère les éléments
            var manifestLink = document.getElementById('dynamic-manifest');
            var pageTitle = document.getElementById('page-title');

            var appleTitle = document.getElementById('apple-web-app-title');

            // Configuration Loches
            if (agence === 'loches') {
                manifestLink.setAttribute('href', 'manifest-loches.json');
                document.title = "O2 Loches";
                if(appleTitle) appleTitle.setAttribute('content', 'O2 Loches');
            }
            // Configuration Nord Touraine (par défaut)
            else {
                manifestLink.setAttribute('href', 'manifest-nord.json');
                document.title = "O2 Nord Touraine";
                if(appleTitle) appleTitle.setAttribute('content', 'O2 Nord Touraine');
            }
        })();
    </script>
    <meta name="theme-color" content="#11183b">
    <meta name="description" content="Guide complet pour les intervenants O2 - rémunération, contacts, documents, simulateur de salaire">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ElSTwGRjbjw6OK2LCvbZGo7iQZdXw3gTPtSBmhNMytA='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'">

    <link rel="preload" href="./fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body class="text-slate-900 dark:text-slate-100 pb-28 md:pb-10 bg-slate-100 dark:bg-slate-900 min-h-screen relative transition-colors duration-200">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:bg-[#11183b] focus:text-white focus:px-4 focus:py-2 focus:rounded-lg">Aller au contenu principal</a>

    <!-- HEADER -->
    <header class="sticky top-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl z-40 border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Custom Logo -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="50" height="50" role="img" aria-label="Logo Agence O2">
                    <circle cx="30" cy="30" r="19" fill="#11183b" stroke="white" stroke-width="7"/>
                    <circle cx="30" cy="30" r="19" fill="#11183b" stroke="#2dd4bf" stroke-width="2"/>
                    <g transform="translate(18, 18)" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </g>
                    <circle cx="46" cy="13" r="5" fill="#14b8a6" stroke="white" stroke-width="2"/>
                </svg>
                <div class="flex flex-col justify-center">
                    <span class="text-xs text-teal-600 dark:text-teal-400 uppercase tracking-widest font-extrabold mb-0.5">Guide Intervenant</span>
                    <h1 id="header-agency-name" class="text-base font-bold text-[#11183b] dark:text-white leading-tight">Agence O2</h1>
                </div>
            </div>

            <!-- Quick Call Button (Blue) -->
            <a href="tel:0243724345" id="header-phone-link" aria-label="Appeler la Ligne Salariés" class="flex items-center gap-2 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:border-blue-800 text-blue-800 dark:text-blue-300 px-3 py-2 rounded-xl border border-blue-100 transition-all active:scale-95 shadow-sm">
                <div class="bg-blue-500 text-white p-1.5 rounded-full flex items-center justify-center">
                    <i data-lucide="phone" class="w-3 h-3 fill-white"></i>
                </div>
                <div class="hidden sm:flex flex-col items-start leading-none">
                    <span class="text-xs uppercase font-bold text-blue-600 dark:text-blue-400">Maladie/Urgence</span>
                    <span id="header-phone-label" class="text-xs font-bold">Ligne Salariés</span>
                </div>
                <span id="header-phone-label-mobile" class="sm:hidden text-xs font-bold flex items-center gap-1">Ligne Salariés</span>
            </a>
        </div>
    </header>

    <!-- INSTALL BANNER (Hidden by default) -->
    <div id="install-banner" class="hidden fixed bottom-24 left-4 right-4 md:left-auto md:right-4 md:w-96 bg-[#11183b] text-white p-5 rounded-2xl shadow-2xl z-50 slide-up border border-teal-500/30">
        <div class="flex items-start gap-4">
            <div class="bg-teal-500/20 p-3 rounded-xl shrink-0">
                <i data-lucide="smartphone" class="w-7 h-7 text-teal-400"></i>
            </div>
            <div class="flex-1">
                <h4 class="font-bold text-base mb-1">Ajouter à l'écran d'accueil</h4>
                <p class="text-xs text-slate-300 leading-snug mb-3">Accès rapide depuis votre téléphone</p>

                <!-- Bouton natif Android (beforeinstallprompt) -->
                <button id="install-btn-native" class="hidden w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 px-4 rounded-xl transition-all text-sm active:scale-95 mb-2">
                    <i data-lucide="download" class="w-4 h-4 inline mr-1"></i> Installer l'application
                </button>

                <!-- Instructions manuelles iOS/Android fallback -->
                <div id="install-steps" class="hidden space-y-2 mb-3">
                    <div class="flex items-center gap-2 bg-white/10 rounded-lg p-2">
                        <span class="bg-teal-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shrink-0">1</span>
                        <p id="install-step1" class="text-xs text-slate-200"></p>
                    </div>
                    <div class="flex items-center gap-2 bg-white/10 rounded-lg p-2">
                        <span class="bg-teal-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shrink-0">2</span>
                        <p id="install-step2" class="text-xs text-slate-200"></p>
                    </div>
                </div>

                <button id="dismiss-install-text" class="text-xs font-bold text-slate-400 hover:text-slate-200 underline decoration-dotted transition-colors py-3">Pas maintenant</button>
            </div>
            <button id="dismiss-install-x" aria-label="Fermer la bannière d'installation" class="text-slate-400 hover:text-white transition-colors p-3"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="max-w-5xl mx-auto p-4 md:p-6 lg:p-8">

        <!-- SECTION: ACCUEIL -->
        <div id="tab-home" class="tab-content active space-y-6 fade-in" role="tabpanel" aria-labelledby="btn-home"></div>

        <!-- SECTION: REMUNERATION (ex PAIE) -->
        <div id="tab-money" class="tab-content space-y-6 fade-in" role="tabpanel" aria-labelledby="btn-money"></div>

        <!-- SECTION: DAILY -->
        <div id="tab-daily" class="tab-content space-y-6 fade-in" role="tabpanel" aria-labelledby="btn-daily"></div>

        <!-- SECTION: DOCUMENTS -->
        <div id="tab-docs" class="tab-content space-y-6 fade-in" role="tabpanel" aria-labelledby="btn-docs"></div>

        <!-- SECTION: AUTRE (ex CLÉS & KMS) -> Contient maintenant Contacts et Infos -->
        <div id="tab-keys" class="tab-content space-y-6 fade-in" role="tabpanel" aria-labelledby="btn-keys"></div>

    </main>

    <!-- NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 w-full z-50 pointer-events-none md:bottom-6">
        <div class="pointer-events-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg border-t md:border border-slate-200 dark:border-slate-800 h-20 md:h-20 md:rounded-2xl md:shadow-2xl md:max-w-4xl mx-auto pb-safe md:pb-0">
            <div class="flex justify-around items-center h-full px-1 md:px-4" role="tablist" aria-label="Navigation principale">
                <button class="nav-btn active flex flex-col items-center justify-center flex-1 h-full rounded-xl transition-all duration-300 text-[#11183b]" id="btn-home" role="tab" aria-selected="true" aria-controls="tab-home" tabindex="0">
                    <i data-lucide="home" class="w-5 h-5 mb-1"></i>
                    <span class="text-xs md:text-xs font-medium text-center leading-tight">Accueil</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center flex-1 h-full rounded-xl transition-all duration-300 text-slate-500" id="btn-daily" role="tab" aria-selected="false" aria-controls="tab-daily" tabindex="-1">
                    <i data-lucide="calendar-check" class="w-5 h-5 mb-1"></i>
                    <span class="text-xs md:text-xs font-medium text-center leading-tight">Quotidien</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center flex-1 h-full rounded-xl transition-all duration-300 text-slate-500" id="btn-money" role="tab" aria-selected="false" aria-controls="tab-money" tabindex="-1">
                    <i data-lucide="euro" class="w-5 h-5 mb-1"></i>
                    <span class="text-xs md:text-xs font-medium text-center leading-tight">Rémunération</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center flex-1 h-full rounded-xl transition-all duration-300 text-slate-500" id="btn-docs" role="tab" aria-selected="false" aria-controls="tab-docs" tabindex="-1">
                    <i data-lucide="file-text" class="w-5 h-5 mb-1"></i>
                    <span class="text-xs md:text-xs font-medium text-center leading-tight">Docs &amp;<br>Services</span>
                </button>

                <button class="nav-btn flex flex-col items-center justify-center flex-1 h-full rounded-xl transition-all duration-300 text-blue-500" id="btn-keys" data-color="blue" role="tab" aria-selected="false" aria-controls="tab-keys" tabindex="-1">
                    <i data-lucide="phone" class="w-5 h-5 mb-1"></i>
                    <span class="text-xs md:text-xs font-medium text-center leading-tight">Contacts &amp;<br>Urgences</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Script principal (module ES, traite par Vite) -->
    <script type="module" src="/src/app.ts"></script>
</body>
</html>
